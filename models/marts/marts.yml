version: 2

models:
  - name: fct_orders
    description: "Final fact table containing order and customer information"

    columns:
      - name: order_id
        description: "Unique identifier for each order"
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer who placed the order"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: net_amount
        description: "Order amount after accounting for refunds"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0